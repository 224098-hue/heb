<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Syrian Eagle Coat of Arms Simplified -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Eagle Body -->
  <ellipse cx="100" cy="100" rx="45" ry="50" fill="url(#goldGradient)" stroke="#8B7520" stroke-width="2"/>
  
  <!-- Wings -->
  <path d="M 55 80 Q 30 70, 20 85 Q 15 95, 25 105 Q 40 110, 55 100 Z" fill="url(#goldGradient)" stroke="#8B7520" stroke-width="1.5"/>
  <path d="M 145 80 Q 170 70, 180 85 Q 185 95, 175 105 Q 160 110, 145 100 Z" fill="url(#goldGradient)" stroke="#8B7520" stroke-width="1.5"/>
  
  <!-- Wing Details Left -->
  <path d="M 55 85 Q 35 80, 28 88" fill="none" stroke="#8B7520" stroke-width="1"/>
  <path d="M 55 90 Q 38 88, 30 93" fill="none" stroke="#8B7520" stroke-width="1"/>
  <path d="M 55 95 Q 40 95, 33 98" fill="none" stroke="#8B7520" stroke-width="1"/>
  
  <!-- Wing Details Right -->
  <path d="M 145 85 Q 165 80, 172 88" fill="none" stroke="#8B7520" stroke-width="1"/>
  <path d="M 145 90 Q 162 88, 170 93" fill="none" stroke="#8B7520" stroke-width="1"/>
  <path d="M 145 95 Q 160 95, 167 98" fill="none" stroke="#8B7520" stroke-width="1"/>
  
  <!-- Head -->
  <circle cx="100" cy="65" r="18" fill="url(#goldGradient)" stroke="#8B7520" stroke-width="2"/>
  
  <!-- Beak -->
  <path d="M 115 65 Q 125 65, 128 62 Q 125 67, 115 67 Z" fill="#D4AF37" stroke="#8B7520" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="108" cy="63" r="3" fill="#2c1810"/>
  <circle cx="109" cy="62" r="1" fill="#fff"/>
  
  <!-- Crown/Stars (3 stars) -->
  <g transform="translate(100, 40)">
    <!-- Center Star -->
    <path d="M 0,-8 L 1.5,-3 L 6.5,-3 L 2.5,0 L 4,5 L 0,2 L -4,5 L -2.5,0 L -6.5,-3 L -1.5,-3 Z" 
          fill="#2c5234" stroke="#1a3a20" stroke-width="0.5"/>
    <!-- Left Star -->
    <path d="M -12,-4 L -10.5,0 L -6,0 L -9.5,2.5 L -8,7 L -12,4 L -16,7 L -14.5,2.5 L -18,0 L -13.5,0 Z" 
          fill="#2c5234" stroke="#1a3a20" stroke-width="0.5"/>
    <!-- Right Star -->
    <path d="M 12,-4 L 13.5,0 L 18,0 L 14.5,2.5 L 16,7 L 12,4 L 8,7 L 9.5,2.5 L 6,0 L 10.5,0 Z" 
          fill="#2c5234" stroke="#1a3a20" stroke-width="0.5"/>
  </g>
  
  <!-- Tail Feathers -->
  <path d="M 85 135 Q 80 150, 85 160" fill="none" stroke="#8B7520" stroke-width="2"/>
  <path d="M 100 138 Q 100 155, 100 165" fill="none" stroke="#8B7520" stroke-width="2"/>
  <path d="M 115 135 Q 120 150, 115 160" fill="none" stroke="#8B7520" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="88" y="138" width="4" height="12" fill="url(#goldGradient)" stroke="#8B7520" stroke-width="1"/>
  <rect x="108" y="138" width="4" height="12" fill="url(#goldGradient)" stroke="#8B7520" stroke-width="1"/>
  
  <!-- Talons -->
  <path d="M 85 150 L 82 155 M 90 150 L 87 155 M 94 150 L 93 155" stroke="#8B7520" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 108 150 L 105 155 M 112 150 L 113 155 M 116 150 L 119 155" stroke="#8B7520" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Shield/Banner at bottom -->
  <rect x="70" y="165" width="60" height="25" rx="3" fill="#c41e3a" stroke="#8B1C2E" stroke-width="2"/>
  <rect x="70" y="180" width="60" height="10" fill="#007a3d" stroke="#005028" stroke-width="1"/>
  <rect x="70" y="165" width="60" height="5" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
</svg>
