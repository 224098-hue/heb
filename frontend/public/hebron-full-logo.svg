<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <!-- Background -->
  <rect width="640" height="120" fill="white"/>
  
  <!-- Arabic Text -->
  <text x="320" y="45" font-family="Arial, sans-serif" font-size="32" fill="#999999" text-anchor="middle" font-weight="300">لجنة إعمار الخليل</text>
  
  <!-- English Text -->
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="middle" font-weight="300">Hebron Reconstruction Committee</text>
  
  <!-- Separator Line -->
  <line x1="430" y1="20" x2="430" y2="100" stroke="#cccccc" stroke-width="2"/>
  
  <!-- Logo Square Background -->
  <rect x="480" y="10" width="140" height="100" fill="#553B2E" rx="8"/>
  
  <!-- Arabic Calligraphy (simplified) -->
  <g transform="translate(550, 60)">
    <path d="M 0,-30 Q -15,-25 -20,-15 Q -15,-5 0,0 Q 15,-5 20,-15 Q 15,-25 0,-30" fill="white" stroke="white" stroke-width="3"/>
    <path d="M -10,0 Q -5,10 0,15 Q 5,10 10,0" fill="white"/>
    <path d="M 0,15 Q -8,25 -15,30 M 0,15 Q 8,25 15,30" stroke="white" stroke-width="3" fill="none"/>
  </g>
</svg>
