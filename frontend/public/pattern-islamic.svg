<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="islamic-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Star pattern -->
      <g fill="none" stroke="#BA9B70" stroke-width="2.5" opacity="0.8">
        <!-- Main cross shapes -->
        <path d="M 50 0 L 75 25 L 100 0 L 125 25 L 150 0 L 125 -25 L 100 -50 L 75 -25 Z" transform="translate(0, 50)"/>
        <path d="M 50 100 L 75 125 L 100 100 L 125 125 L 150 100 L 125 75 L 100 50 L 75 75 Z" transform="translate(0, 50)"/>
        
        <!-- Connecting lines -->
        <line x1="0" y1="50" x2="200" y2="50"/>
        <line x1="0" y1="150" x2="200" y2="150"/>
        <line x1="50" y1="0" x2="50" y2="200"/>
        <line x1="150" y1="0" x2="150" y2="200"/>
        
        <!-- Corner stars -->
        <circle cx="50" cy="50" r="8"/>
        <circle cx="150" cy="50" r="8"/>
        <circle cx="50" cy="150" r="8"/>
        <circle cx="150" cy="150" r="8"/>
        
        <!-- Decorative elements -->
        <path d="M 30 50 Q 50 30, 70 50" stroke-linecap="round"/>
        <path d="M 130 50 Q 150 30, 170 50" stroke-linecap="round"/>
        <path d="M 30 150 Q 50 130, 70 150" stroke-linecap="round"/>
        <path d="M 130 150 Q 150 130, 170 150" stroke-linecap="round"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="400" height="400" fill="url(#islamic-pattern)"/>
</svg>
